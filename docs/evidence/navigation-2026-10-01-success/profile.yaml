bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerHybrid
      tolerance: 0.25
      allow_unknown: false
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      minimum_turning_radius: 0.6
      allow_primitive_interpolation: true
      max_planning_time: 2.0
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      analytic_expansion_max_length: 6.25
      cost_penalty: 2.0
      non_straight_penalty: 1.1
      change_penalty: 0.0
      cache_obstacle_heuristic: false
      smooth_path: true
controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    odom_topic: /odom
    controller_frequency: 20.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 3.141592653589793
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 2.2
      lookahead_dist: 0.65
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.6
      use_rotate_to_heading: false
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 2.2
      regulated_linear_scaling_min_speed: 0.1
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      max_robot_pose_search_dist: 7.0
      stateful: true
behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    transform_tolerance: 0.3
    cycle_frequency: 10.0
    behavior_plugins:
    - wait
    - backup
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 24
      height: 24
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      track_unknown_space: true
      footprint: '[[0.6,0.5],[-1.1,0.5],[-1.1,-0.5],[0.6,-0.5]]'
      footprint_padding: 0.02
      plugins:
      - obstacle_layer
      - lane_layer
      - hazard_layer
      - depth_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan scan_obstacles
        scan:
          topic: /scan
          data_type: LaserScan
          marking: false
          clearing: true
          inf_is_valid: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.15
          obstacle_max_range: 11.5
          raytrace_min_range: 0.0
          raytrace_max_range: 12.0
          observation_persistence: 0.0
          expected_update_rate: 0.6
        scan_obstacles:
          topic: /perception/lidar/obstacles_scan
          data_type: LaserScan
          marking: true
          clearing: false
          inf_is_valid: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.15
          obstacle_max_range: 11.5
          observation_persistence: 0.0
          expected_update_rate: 0.6
      lane_layer:
        plugin: igvc_lane_layer::LaneLayer
      hazard_layer:
        plugin: igvc_lane_layer::LaneLayer
        topic: /perception/hazards/points
      depth_layer:
        plugin: igvc_lane_layer::LaneLayer
        topic: /perception/depth/obstacles
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.3
        cost_scaling_factor: 5.0
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: true
