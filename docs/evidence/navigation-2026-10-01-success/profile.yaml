      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan scan_obstacles
        scan:
          topic: /scan
          data_type: LaserScan
          marking: false
          clearing: true
          inf_is_valid: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.15
          obstacle_max_range: 11.5
          raytrace_min_range: 0.0
          raytrace_max_range: 12.0
          observation_persistence: 0.0
          expected_update_rate: 0.6
        scan_obstacles:
          topic: /perception/lidar/obstacles_scan
          data_type: LaserScan
          marking: true
          clearing: false
          inf_is_valid: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.15
          obstacle_max_range: 11.5
          observation_persistence: 0.0
          expected_update_rate: 0.6
      lane_layer:
        plugin: igvc_lane_layer::LaneLayer
      hazard_layer:
        plugin: igvc_lane_layer::LaneLayer
        topic: /perception/hazards/points
      depth_layer:
        plugin: igvc_lane_layer::LaneLayer
        topic: /perception/depth/obstacles
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.3
        cost_scaling_factor: 5.0
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: true
